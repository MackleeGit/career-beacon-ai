[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# VITE_API_URL must be set in the Netlify dashboard → Site Settings → Environment Variables
# Value: your Render service URL, e.g. https://career-beacon-api.onrender.com
# Do NOT hardcode it here — it changes per deployment environment.

# SPA fallback – send all routes to index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
