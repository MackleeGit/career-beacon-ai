<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UML Class Diagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .toolbar {
            margin-bottom: 12px;
        }
        .btn {
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background: #333333; }
        svg {
            background: #ffffff;
            border: 2px solid #000000;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn" onclick="exportPNG()">Download High-Res PNG</button>
</div>

<svg id="diagram-svg" width="1060" height="720" viewBox="0 0 1060 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Dependency open dashed arrow -->
        <marker id="dash-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5"/>
        </marker>
        <!-- Association arrow -->
        <marker id="assoc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
        </marker>
        <!-- Composition filled diamond -->
        <marker id="diamond-black" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <polygon points="0,6 6,1 12,6 6,11" fill="#000000"/>
        </marker>
        <!-- Aggregation open diamond -->
        <marker id="diamond-white" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <polygon points="0,6 6,1 12,6 6,11" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        </marker>
    </defs>

    <!-- Canvas Background -->
    <rect width="1060" height="720" fill="#ffffff"/>

    <!-- ================= RELATIONSHIP CONNECTOR LINES ================= -->

    <!-- 1. User -> UserSkill (1 to 1..*) -->
    <line x1="230" y1="105" x2="280" y2="105" stroke="#000000" stroke-width="1.5" marker-start="url(#diamond-white)"/>
    <text x="255" y="97" font-size="11" font-weight="bold" text-anchor="middle">1..*</text>

    <!-- 2. UserSkill -> Skill (1..* to 1) -->
    <line x1="480" y1="105" x2="530" y2="105" stroke="#000000" stroke-width="1.5" marker-end="url(#assoc-arrow)"/>
    <text x="505" y="97" font-size="11" font-weight="bold" text-anchor="middle">1</text>

    <!-- 3. User -> Career (target_career 0..1) -->
    <line x1="130" y1="195" x2="130" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#assoc-arrow)"/>
    <text x="145" y="226" font-size="11" font-weight="bold">target 0..1</text>

    <!-- 4. Career -> CareerSkill (1 to 1..*) -->
    <line x1="230" y1="335" x2="280" y2="335" stroke="#000000" stroke-width="1.5" marker-start="url(#diamond-white)"/>
    <text x="255" y="327" font-size="11" font-weight="bold" text-anchor="middle">1..*</text>

    <!-- 5. CareerSkill -> Skill (1..* to 1) -->
    <path d="M 480 335 L 630 335 L 630 195" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#assoc-arrow)"/>
    <text x="515" y="327" font-size="11" font-weight="bold">1</text>

    <!-- 6. Skill -> MicroContent (1 to 1..*) -->
    <line x1="630" y1="195" x2="630" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#assoc-arrow)"/>
    <text x="642" y="226" font-size="11" font-weight="bold">1..*</text>

    <!-- 7. MicroContent -> QuizItem (Composition 1 to 3..5) -->
    <line x1="730" y1="335" x2="790" y2="335" stroke="#000000" stroke-width="1.5" marker-start="url(#diamond-black)"/>
    <text x="760" y="327" font-size="11" font-weight="bold" text-anchor="middle">3..5</text>

    <!-- 8. User -> Mentor (profile 1 to 0..1) -->
    <!-- Clean top routing from User to Mentor -->
    <path d="M 130 25 L 130 12 L 895 12 L 895 25" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#assoc-arrow)"/>
    <text x="510" y="20" font-size="11" font-weight="bold" text-anchor="middle">profile_id (0..1)</text>

    <!-- 9. Mentor -> MentorQA (Composition 1 to 0..*) -->
    <line x1="995" y1="105" x2="1040" y2="105" stroke="#000000" stroke-width="1.5"/>
    <line x1="1040" y1="105" x2="1040" y2="335" stroke="#000000" stroke-width="1.5"/>
    <line x1="1040" y1="335" x2="1000" y2="335" stroke="#000000" stroke-width="1.5" marker-start="url(#diamond-black)"/>
    <text x="1015" y="325" font-size="10.5" font-weight="bold">0..*</text>

    <!-- 10. Services Dependency Arrows -->
    <!-- RecommendationEngine to EmbeddingService -->
    <line x1="330" y1="565" x2="240" y2="565" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#dash-arrow)"/>
    <text x="285" y="557" font-size="11" font-weight="bold" text-anchor="middle">«uses»</text>

    <!-- RecommendationEngine to LLMService -->
    <line x1="720" y1="565" x2="770" y2="565" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#dash-arrow)"/>
    <text x="745" y="557" font-size="11" font-weight="bold" text-anchor="middle">«uses»</text>

    <!-- RecommendationEngine to MicroContent (queries/updates) -->
    <line x1="525" y1="480" x2="630" y2="425" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#dash-arrow)"/>
    <text x="585" y="460" font-size="11" font-weight="bold">«ranks»</text>


    <!-- ================= ROW 1: USER, SKILL & MENTOR ================= -->

    <!-- CLASS 1: User -->
    <g transform="translate(30, 25)">
        <rect width="200" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">User</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- email: String</text>
        <text x="8" y="74" font-size="11" fill="#000000">- full_name: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- target_career_id: UUID</text>
        <text x="8" y="106" font-size="11" fill="#000000">- bio: String</text>

        <line x1="0" y1="114" x2="200" y2="114" stroke="#000000" stroke-width="1"/>

        <text x="8" y="130" font-size="10.5" fill="#000000">+ set_target_career(id): void</text>
        <text x="8" y="146" font-size="10.5" fill="#000000">+ get_readiness_score(): float</text>
        <text x="8" y="162" font-size="10.5" fill="#000000">+ is_onboarded(): boolean</text>
    </g>

    <!-- CLASS 2: UserSkill (Junction) -->
    <g transform="translate(280, 25)">
        <rect width="200" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">UserSkill</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- user_id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- skill_id: UUID</text>
        <text x="8" y="74" font-size="11" fill="#000000">- proficiency: Integer (0-100)</text>
        <text x="8" y="90" font-size="11" fill="#000000">- last_used: DateTime</text>

        <line x1="0" y1="100" x2="200" y2="100" stroke="#000000" stroke-width="1"/>

        <text x="8" y="118" font-size="10.5" fill="#000000">+ add_proficiency(xp=10): void</text>
        <text x="8" y="134" font-size="10.5" fill="#000000">+ is_mastered(): boolean</text>
        <text x="8" y="150" font-size="10.5" fill="#000000">+ get_gap(target=80): int</text>
        <text x="8" y="164" font-size="10.5" fill="#000000">+ set_baseline(tier): void</text>
    </g>

    <!-- CLASS 3: Skill -->
    <g transform="translate(530, 25)">
        <rect width="200" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Skill</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- name: String</text>
        <text x="8" y="74" font-size="11" fill="#000000">- category: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- created_at: DateTime</text>

        <line x1="0" y1="102" x2="200" y2="102" stroke="#000000" stroke-width="1"/>

        <text x="8" y="122" font-size="10.5" fill="#000000">+ get_lessons(): List</text>
        <text x="8" y="140" font-size="10.5" fill="#000000">+ get_proficiency(uid): int</text>
        <text x="8" y="158" font-size="10.5" fill="#000000">+ validate_name(): boolean</text>
    </g>

    <!-- CLASS 4: Mentor -->
    <g transform="translate(790, 25)">
        <rect width="210" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="210" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="105" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Mentor</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- profile_id: UUID</text>
        <text x="8" y="74" font-size="11" fill="#000000">- bio: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- expertise: String</text>
        <text x="8" y="106" font-size="11" fill="#000000">- mentor_vector: List&lt;Float&gt;</text>

        <line x1="0" y1="114" x2="210" y2="114" stroke="#000000" stroke-width="1"/>

        <text x="8" y="130" font-size="10.5" fill="#000000">+ match_query(vector): float</text>
        <text x="8" y="146" font-size="10.5" fill="#000000">+ book_slot(uid, slot): bool</text>
        <text x="8" y="162" font-size="10.5" fill="#000000">+ get_qa_pairs(): List</text>
    </g>


    <!-- ================= ROW 2: CAREER, CONTENT & QUIZZES ================= -->

    <!-- CLASS 5: Career -->
    <g transform="translate(30, 250)">
        <rect width="200" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Career</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- title: String</text>
        <text x="8" y="74" font-size="11" fill="#000000">- description: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- career_vector: vector(384)</text>
        <text x="8" y="106" font-size="11" fill="#000000">- created_at: DateTime</text>

        <line x1="0" y1="114" x2="200" y2="114" stroke="#000000" stroke-width="1"/>

        <text x="8" y="132" font-size="10.5" fill="#000000">+ get_required_skills(): List</text>
        <text x="8" y="150" font-size="10.5" fill="#000000">+ cosine_distance(vec): float</text>
        <text x="8" y="168" font-size="10.5" fill="#000000">+ to_dict(): Dict</text>
    </g>

    <!-- CLASS 6: CareerSkill (Junction) -->
    <g transform="translate(280, 250)">
        <rect width="200" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">CareerSkill</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- career_id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- skill_id: UUID</text>
        <text x="8" y="74" font-size="11" fill="#000000">- rank: Integer</text>

        <line x1="0" y1="90" x2="200" y2="90" stroke="#000000" stroke-width="1"/>

        <text x="8" y="114" font-size="10.5" fill="#000000">+ get_priority_weight(): float</text>
        <text x="8" y="134" font-size="10.5" fill="#000000">+ reorder_rank(r): void</text>
        <text x="8" y="154" font-size="10.5" fill="#000000">+ is_mandatory(): boolean</text>
    </g>

    <!-- CLASS 7: MicroContent -->
    <g transform="translate(530, 250)">
        <rect width="200" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="200" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="100" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">MicroContent</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- id: UUID</text>
        <text x="8" y="58" font-size="11" fill="#000000">- title: String</text>
        <text x="8" y="74" font-size="11" fill="#000000">- summary_bullets: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- associated_skill_id: UUID</text>
        <text x="8" y="106" font-size="11" fill="#000000">- difficulty_level: Int (1-5)</text>

        <line x1="0" y1="114" x2="200" y2="114" stroke="#000000" stroke-width="1"/>

        <text x="8" y="132" font-size="10.5" fill="#000000">+ get_quizzes(): List&lt;Quiz&gt;</text>
        <text x="8" y="150" font-size="10.5" fill="#000000">+ compute_gap_weight(): float</text>
        <text x="8" y="168" font-size="10.5" fill="#000000">+ verify_trust(): float</text>
    </g>

    <!-- CLASS 8: QuizItem -->
    <g transform="translate(790, 250)">
        <rect width="210" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="210" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="105" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">QuizItem</text>
        
        <text x="8" y="42" font-size="11" fill="#000000">- question: String</text>
        <text x="8" y="58" font-size="11" fill="#000000">- options: List&lt;String&gt; (4)</text>
        <text x="8" y="74" font-size="11" fill="#000000">- answer: String</text>
        <text x="8" y="90" font-size="11" fill="#000000">- explanation: String</text>

        <line x1="0" y1="102" x2="210" y2="102" stroke="#000000" stroke-width="1"/>

        <text x="8" y="124" font-size="10.5" fill="#000000">+ check_answer(opt): boolean</text>
        <text x="8" y="144" font-size="10.5" fill="#000000">+ sanitize(): Dict</text>
        <text x="8" y="164" font-size="10.5" fill="#000000">+ is_valid(): boolean</text>
    </g>


    <!-- ================= ROW 3: ENGINE & SERVICE ARCHITECTURE ================= -->

    <!-- CLASS 9: EmbeddingService -->
    <g transform="translate(30, 480)">
        <rect width="210" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="210" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="105" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">EmbeddingService</text>
        
        <text x="8" y="44" font-size="11" fill="#000000">- model_name: String</text>
        <text x="8" y="62" font-size="11" fill="#000000">- dimension: Integer = 384</text>
        <text x="8" y="80" font-size="11" fill="#000000">- device: String = "cpu"</text>

        <line x1="0" y1="94" x2="210" y2="94" stroke="#000000" stroke-width="1"/>

        <text x="8" y="118" font-size="10.5" fill="#000000">+ get_embedding(txt): List</text>
        <text x="8" y="138" font-size="10.5" fill="#000000">+ batch_embed(texts): List</text>
        <text x="8" y="158" font-size="10.5" fill="#000000">+ cosine_sim(v1, v2): float</text>
    </g>

    <!-- CLASS 10: RecommendationEngine -->
    <g transform="translate(330, 480)">
        <rect width="390" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="390" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="195" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">RecommendationEngine</text>
        
        <text x="8" y="44" font-size="11" fill="#000000">- weights: Dict = {gap: 0.45, sim: 0.35, diff: 0.20}</text>
        <text x="8" y="62" font-size="11" fill="#000000">- recall_limit: Integer = 30</text>
        <text x="8" y="80" font-size="11" fill="#000000">- final_feed_limit: Integer = 5</text>

        <line x1="0" y1="94" x2="390" y2="94" stroke="#000000" stroke-width="1"/>

        <text x="8" y="116" font-size="10.5" fill="#000000">+ stage1_recall(user_id): List&lt;MicroContent&gt;</text>
        <text x="8" y="136" font-size="10.5" fill="#000000">+ stage2_rerank(candidates, user): List&lt;MicroContent&gt;</text>
        <text x="8" y="156" font-size="10.5" fill="#000000">+ submit_quiz(user_id, content_id, answers): Dict</text>
    </g>

    <!-- CLASS 11: LLMService -->
    <g transform="translate(770, 480)">
        <rect width="260" height="175" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <rect width="260" height="26" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
        <text x="130" y="18" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">LLMService</text>
        
        <text x="8" y="44" font-size="11" fill="#000000">- primary: "groq_llama_3.3_70b"</text>
        <text x="8" y="62" font-size="11" fill="#000000">- fallback: "gemini_1.5_flash"</text>
        <text x="8" y="80" font-size="11" fill="#000000">- timeout_seconds: Integer = 8</text>

        <line x1="0" y1="94" x2="260" y2="94" stroke="#000000" stroke-width="1"/>

        <text x="8" y="116" font-size="10.5" fill="#000000">+ synthesize_taxonomy(query): Dict</text>
        <text x="8" y="136" font-size="10.5" fill="#000000">+ generate_mcqs(text): Dict</text>
        <text x="8" y="156" font-size="10.5" fill="#000000">+ call_failover(prompt): Dict</text>
    </g>

</svg>

<script>
function exportPNG() {
    const svg = document.getElementById('diagram-svg');
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement('canvas');
    const scale = 2;
    canvas.width = svg.getAttribute('width') * scale;
    canvas.height = svg.getAttribute('height') * scale;
    const ctx = canvas.getContext('2d');
    
    const img = new Image();
    const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    
    img.onload = function() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        
        const a = document.createElement('a');
        a.download = 'UML_Class_Diagram.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
    };
    img.src = url;
}
</script>

</body>
</html>
